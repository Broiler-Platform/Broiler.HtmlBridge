name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: Resolved preview version for a publish run
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  PACKAGE_VERSION: ${{ inputs.package-version }}

jobs:
  neutrality:
    name: Engine neutrality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test the engine coupling guard
        run: python3 scripts/test-engine-neutrality.py

      - name: Verify no project gained engine coupling
        shell: bash
        run: bash ./scripts/check-engine-neutrality.sh

  build:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        # Every assembly here is platform-neutral net10.0, so both legs compile the
        # same sources. They run anyway because this component drives a JavaScript
        # engine and a DOM through it, and the two hosts have disagreed before about
        # culture, text and file-system case.
        os: [ubuntu-latest, windows-latest]
        configuration: [Release]
        include:
          # Link Scripting.Vm and the Broiler.JSeal.Vm package into the tests and define
          # BROILER_VM_JS, so this leg exercises the VM profile's additional cases.
          - os: ubuntu-latest
            configuration: Release-VM

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test preview version selection
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Build
        run: |
          args=()
          if [ -n "$PACKAGE_VERSION" ]; then
            args+=("-p:Version=$PACKAGE_VERSION" "-p:PackageVersion=$PACKAGE_VERSION")
          fi
          dotnet build Broiler.HtmlBridge.slnx -c ${{ matrix.configuration }} --nologo "${args[@]}"

      # Asserting the configuration MAPPING, not just that the build succeeded. A
      # configuration name the SDK does not recognise gets neither Optimize nor
      # DebugSymbols: `-c Release-VM` would compile UNOPTIMISED, succeed, and say
      # nothing. eng/Broiler.Configurations.props is what stops that, and this is the
      # only thing that can see whether it still works. Evaluation only; nothing builds.
      - name: Verify the build type means what it says
        if: matrix.configuration == 'Release-VM'
        run: |
          set -uo pipefail
          status=0
          optimize="$(dotnet msbuild src/Broiler.HtmlBridge.Dom/Broiler.HtmlBridge.Dom.csproj -p:Configuration=Release-VM -getProperty:Optimize -nologo | tr -d '[:space:]')"
          constants="$(dotnet msbuild src/Broiler.HtmlBridge.Dom/Broiler.HtmlBridge.Dom.csproj -p:Configuration=Release-VM -getProperty:DefineConstants -nologo | tr -d '[:space:]')"
          [ "$optimize" = "true" ] || { echo "::error::Release-VM answers Optimize='$optimize'; the mapping in eng/Broiler.Configurations.props is not reaching this project."; status=1; }
          case ";$constants;" in *";BROILER_VM_JS;"*) ;; *) echo "::error::Release-VM does not define BROILER_VM_JS ($constants); the VM-only test cases would compile away silently."; status=1;; esac
          # RELEASE exactly once: applying the mapping twice is harmless to the
          # compiler and makes the constants list depend on which component you ask.
          count="$(printf '%s' "$constants" | tr ';' '\n' | grep -c '^RELEASE$' || true)"
          [ "$count" = "1" ] || { echo "::error::Release-VM defines RELEASE $count times ($constants); the mapping ran more than once."; status=1; }
          exit "$status"

      - name: Test
        shell: pwsh
        run: ./eng/run-tests.ps1 -Configuration ${{ matrix.configuration }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.configuration }}
          path: test-results/
          if-no-files-found: warn

      - name: Pack and verify every package
        if: matrix.os == 'windows-latest' && matrix.configuration == 'Release'
        shell: pwsh
        run: ./eng/pack.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload packages
        if: matrix.os == 'windows-latest' && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error
